# Local dev stack: FastAPI backend + Vite frontend (boot placeholder, real
# shell lands at G-6) + a self-hosted local Supabase (Postgres+pgvector,
# GoTrue auth, PostgREST, Realtime, Storage, fronted by a Kong gateway).
#
# `docker-compose up` boots the entire stack with no other setup required --
# the Supabase-side services below use the well-known Supabase *local
# development* demo secrets (the same ones the Supabase CLI's `supabase
# start` and Supabase's own self-hosting docs publish; they are not real
# secrets). These MUST match backend/.env's SUPABASE_* values and
# frontend/.env's VITE_SUPABASE_* values -- see .env.example / frontend/.env.example.
# Override any of them via a root-level `.env` file read by docker-compose
# itself if you want different local values.
#
# Ports on the host:
#   3000  - frontend (Vite dev server); also where the project health-check
#           command (`curl -f http://localhost:3000/api/health`) resolves,
#           via the Vite dev-server proxy forwarding /api/* to the backend.
#   8000  - FastAPI backend (matches VITE_API_BASE_URL's documented example
#           in design.md: http://localhost:8000/api).
#   54321 - Supabase API gateway (Kong) -- mirrors the Supabase CLI's own
#           local port convention, avoiding a collision with the backend's
#           port 8000.
#   54322 - Postgres (mirrors the Supabase CLI's own local port convention).
#
# NOTE: this self-hosted Supabase configuration is assembled from Supabase's
# published self-hosting reference (https://supabase.com/docs/guides/self-hosting/docker).
# If an image tag below has been retired upstream, bump it per that doc.

x-supabase-demo-secrets: &supabase-demo-secrets
  POSTGRES_PASSWORD: &postgres-password "postgres"
  JWT_SECRET: &jwt-secret "super-secret-jwt-token-with-at-least-32-characters-long"
  ANON_KEY: &anon-key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  SERVICE_ROLE_KEY: &service-role-key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

services:
  db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: postgres
      JWT_SECRET: *jwt-secret
      JWT_EXP: "3600"
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Supabase's postgres image auto-runs any .sql files mounted here (after
      # its own baked-in auth/storage/realtime schema init) -- this is how our
      # migrations (backend/supabase/migrations/) get applied on first boot.
      - ./backend/supabase/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      # Local-only: auto-confirm signups so there's no SMTP dependency for dev.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres"
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.25.50
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: *postgres-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: "UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1u2oq"
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  storage:
    image: supabase/storage-api:v0.46.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-role-key
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: *jwt-secret
      DATABASE_URL: "postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    ports:
      - "54321:8000"
    volumes:
      - ./backend/supabase/kong.yml:/var/lib/kong/kong.yml:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - kong
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's SUPABASE_URL for the containerized run: from
      # inside the compose network the backend reaches Kong by service name,
      # not by the host-published localhost:54321 port.
      SUPABASE_URL: http://kong:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      # Consumed only by vite.config.ts's dev-server proxy (server-side,
      # never bundled into the browser build) -- routes /api/* on port 3000
      # to the backend, which is what the health-check command relies on.
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
  storage-data:
